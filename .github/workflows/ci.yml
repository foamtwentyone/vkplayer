name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    name: Сборка и тесты (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Тесты
        run: dotnet test tests/VkHotkeys.Core.Tests -c Release
      - name: Публикация
        shell: pwsh
        run: ./scripts/publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: VkHotkeys
          path: dist/VkHotkeys

  e2e:
    name: Сквозной тест расширения (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Сборка моста и харнесса
        run: |
          dotnet build src/VkHotkeys.Bridge
          dotnet build tests/e2e/harness
      - name: Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: E2E
        run: node tests/e2e/run-e2e.js
